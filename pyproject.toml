[project]
name = "agentguard"
version = "0.1.0.dev0"
description = "Host-powered reliability and reasoning control layer for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGuard" }]
keywords = ["ai", "agents", "reliability", "guardrails", "claude-code", "hallucination"]

# NOTE (SPEC §6, §46.1): AgentGuard must never own an LLM. No provider SDK
# (anthropic, openai, google-generativeai, litellm, langchain, ...) may ever appear
# in these dependencies. Enforced by tests/spec/test_s06_no_llm.py.
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Multi-language symbol extraction. Python uses stdlib `ast` and needs nothing here.
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
agentguard = "agentguard.cli.main:app"
# Stdlib-only fallback shim (command-hook transport). Kept dependency-free on purpose.
agentguard-hook = "agentguard.adapters.claude_code.shim:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "spec: spec-conformance test tied to a section of the SPEC document",
    "latency: measures latency budgets (SPEC §8)",
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.coverage.run]
source = ["src/agentguard"]
